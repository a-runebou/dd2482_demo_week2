name: Mutation testing

on:
    push:
    workflow_dispatch:

jobs:
    mutation:
        if: >-
            github.event_name == 'workflow_dispatch' ||
            contains(github.event.head_commit.message, '[mutation]')

        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-python@v6
              with:
                  python-version: '3.12'
            - name: Install project
              run: pip install -e ".[dev]"

            - name: Run tests with coverage
              run: pytest --cov=shipping --cov-report=term-missing --cov-fail-under=100

            - name: Run mutation testing
              run: mutmut run

            - name: Check mutation results
              if: always()
              shell: bash
              run: |
                mutmut results > mutation_results.txt
                cat mutation_results.txt

                if grep -Eq 'survived\s*$' mutation_results.txt; then
                    echo "Some mutations survived"
                    exit 1
                fi