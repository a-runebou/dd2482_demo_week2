name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest

        env:
          RUN_MUTATION_TESTS: >-
            ${{ github.event_name == 'workflow_dispatch' || 
                (github.event_name == 'push' && 
                contains(github.event.head_commit.message, '[mutation]')) }}

        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-python@v6
              with:
                  python-version: '3.12'

            - name: Install project
              run: pip install -e ".[dev]"

            - name: Run tests with coverage
              run: |
                pytest \
                  --cov=shipping \
                  --cov-report=term-missing \
                  --cov-report=json:coverage.json \
                  --cov-fail-under=100 \
                  --junitxml=test-results.xml

            - name: Summary of tests and coverage
              if: always()
              shell: bash
              run: |
                echo "# Test results" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "| Metric | Result |" >> "$GITHUB_STEP_SUMMARY"
                echo "| --- | ---: |" >> "$GITHUB_STEP_SUMMARY"

                if [ -f test-results.xml ]; then
                    python - <<'PY'
                import os
                import xml.etree.ElementTree as ET

                root = ET.parse("test-results.xml").getroot()
                suites = [root] if root.tag == "testsuite" else root.findall("testsuite")

                tests = sum(int(suite.get("tests", 0)) for suite in suites)
                failures = sum(int(suite.get("failures", 0)) for suite in suites)
                errors = sum(int(suite.get("errors", 0)) for suite in suites)
                skipped = sum(int(suite.get("skipped", 0)) for suite in suites)
                passed = tests - failures - errors - skipped

                with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                    summary.write(f"| Tests | {tests} |\n")
                    summary.write(f"| Passed | {passed} |\n")
                    summary.write(f"| Failed | {failures + errors} |\n")
                    summary.write(f"| Skipped | {skipped} |\n")
                PY
                fi

                if [ -f coverage.json ]; then
                    COVERAGE=$(python -c "
                import json
                with open('coverage.json') as f:
                    data = json.load(f)
                print(data['totals']['percent_covered_display'])
                ")
                    echo "| Coverage | ${COVERAGE}% |" >> "$GITHUB_STEP_SUMMARY"
                fi

            - name: Run mutation testing
              if: env.RUN_MUTATION_TESTS == 'true'
              run: mutmut run

            - name: Check mutation results
              if: env.RUN_MUTATION_TESTS == 'true'
              shell: bash
              run: |
                mutmut results > mutation_results.txt
                cat mutation_results.txt

                SURVIVED=$(grep -Ec 'survived\s*$' mutation_results.txt || true)

                {
                    echo "## Mutation results"
                    echo ""
                    echo "| Metric | Result |"
                    echo "| --- | ---: |"
                    echo "| Survived | $SURVIVED |"
                } >> "$GITHUB_STEP_SUMMARY"

                if [ "$SURVIVED" -gt 0 ]; then
                    echo "" >> "$GITHUB_STEP_SUMMARY"
                    echo "❌ ${SURVIVED} mutant(s) survived." >> "$GITHUB_STEP_SUMMARY"
                    exit 1
                else
                    echo "" >> "$GITHUB_STEP_SUMMARY"
                    echo "✅ All mutants killed." >> "$GITHUB_STEP_SUMMARY"
                fi